name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Install the current GitHub revision as a uv tool
        run: uv tool install "git+${{ github.server_url }}/${{ github.repository }}.git@${{ github.event.pull_request.head.sha || github.sha }}" --force
      - run: npm run check

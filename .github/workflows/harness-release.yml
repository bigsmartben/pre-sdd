name: Harness Release Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-release:
    name: Harness Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full release readiness
        run: node .psp/harness/scripts/run-ci-validation.mjs --context release

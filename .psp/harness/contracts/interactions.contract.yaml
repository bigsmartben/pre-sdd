apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: interactions
  version: 3.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 将已批准 Use Case 场景转换为可直接指导 HTML Mock 的中保真 Screen、内容层级、Control、状态与分支流转规格。
  owns:
    - Use Case 场景到 Wireflow 的追溯
    - Screen Registry 与页面区域/内容层级
    - 语义 Control 及其动作意图
    - 可见交互状态、反馈与场景分支流转
  excludes:
    - 新产品能力
    - 可复用代码组件划分
    - 视觉 Token
    - HTML/CSS/JavaScript 实现
    - 生产实现细节
  domainRules:
    - unique-identifiers
    - interaction-upstream-references
    - interaction-local-references
    - interaction-use-case-scenario-coverage
    - interaction-screen-anatomy-complete
    - interaction-state-transition-integrity
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

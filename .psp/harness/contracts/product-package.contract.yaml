apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: product-package
  version: 3.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 声明产品设计 Package 概览、UC → Wireflow Mid → HTML Mock 主链、支撑产物与交付门禁。
  owns:
    - 产品概览
    - 三段主链与支撑产物读取顺序
    - Package 级 readiness gate
  excludes:
    - 能力正文
    - 交互正文
    - HTML Mock 代码正文与软件架构实现细节
  domainRules:
    - package-primary-chain-order
    - package-supporting-artifacts-explicit
    - package-overview-complete
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

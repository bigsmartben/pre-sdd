apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: traceability
  version: 3.0.0
spec:
  stage: product-design
  internalModelFormat: json
  outputRole: generated-support
  purpose: 作为派生支撑事实维护 Use Case、Wireflow 与 HTML Mock 的机器可校验精确映射，并生成原型代码所需的机器支撑；不形成用户产物。
  owns:
    - UC 到 WF 的映射
    - UC 到 HTML Mock 的映射
  excludes:
    - 规格正文
    - 用户目录路径绑定
    - 架构追溯
  domainRules:
    - unique-identifiers
    - traceability-reference-integrity
    - traceability-exact-coverage
  readiness:
    requiredStatus: not-applicable
    requireNoGaps: false
    requireAllGates: false

apiVersion: psp.dev/v1
kind: PSPProject
stages:
  product-design:
    status: uninitialized
    root: 01-product-design
    publication:
      receipt: .psp/publications/product-design.json
    artifacts:
      capabilities:
        format: yaml
        renderer: capabilities-markdown
        contract: .agents/skills/product-design/capabilities/contract.yaml
        schema: .agents/skills/product-design/capabilities/schema.json
        template: .agents/skills/product-design/capabilities/template.yaml
        internalModel: .psp/models/use-cases.yaml
        outputs:
          - path: UC.md
            role: user-artifact
            projection: use-cases-document
      functional-delivery-baseline:
        format: json
        contract: .agents/skills/product-design/functional-delivery-baseline/contract.yaml
        schema: .agents/skills/product-design/functional-delivery-baseline/schema.json
        template: .agents/skills/product-design/functional-delivery-baseline/template.json
        internalModel: .psp/models/functional-delivery-baseline.json
  user-path-cases:
    status: uninitialized
    root: ""
    artifacts:
      test-case-catalog:
        format: json
        contract: .agents/skills/user-path-cases/contracts/test-case-catalog.md
        schema: .agents/skills/user-path-cases/schemas/test-case-catalog.schema.json
        template: .agents/skills/user-path-cases/templates/test-cases.json
        internalModel: Cases/test-cases.json
      user-path-plan:
        format: json
        contract: .agents/skills/user-path-cases/contracts/user-path-plan.md
        schema: .agents/skills/user-path-cases/schemas/user-path-plan.schema.json
        internalModel: .psp/visual-spec/user-path-plan.json
  visual-spec:
    status: uninitialized
    root: ""
    artifacts:
      checklist:
        format: json
        contract: .agents/skills/visual-spec/contracts/visual-spec-contract.md
        schema: .agents/skills/visual-spec/schemas/visual-spec-checklist.schema.json
        template: .agents/skills/visual-spec/templates/visual-spec-checklist.json
        internalModel: .psp/visual-spec/checklist.json
      ready-authorization:
        format: json
        schema: .agents/skills/visual-spec/schemas/ready-authorization.schema.json
        internalModel: .psp/visual-spec/ready-authorization.json
  figma-evidence:
    status: uninitialized
    root: ""
    contract: .agents/skills/figma-evidence/contracts/figma-evidence-contract.md
    artifacts:
      figma-coverage:
        format: json
        schema: .agents/skills/figma-evidence/schemas/figma-coverage.schema.json
        internalModel: .psp/visual-spec/figma-coverage.json
      figma-evidence:
        format: json
        schema: .agents/skills/figma-evidence/schemas/figma-evidence.schema.json
        internalModel: .psp/visual-spec/figma-evidence.json
  flutter-ui:
    status: uninitialized
    root: ""
    implementation:
      template: .agents/skills/implement-flutter-ui/templates/flutter-workspace
      authorityRoot: lib/ui
      entry: lib/main.dart
    review:
      entry: lib/review/review_main.dart
      role: selected-target-flutter-preview
      targets: [android, ios, web]
    artifacts:
      flutter-visual-coverage:
        format: json
        contract: .agents/skills/flutter-ui/contracts/flutter-ui.md
        schema: .agents/skills/flutter-ui/schemas/flutter-visual-coverage.schema.json
        template: .agents/skills/flutter-ui/templates/flutter-visual-coverage.json
        internalModel: .psp/ui-spec/flutter-visual-coverage.json
      flutter-user-path-coverage:
        format: json
        contract: .agents/skills/flutter-ui/contracts/flutter-ui.md
        schema: .agents/skills/flutter-ui/schemas/flutter-user-path-coverage.schema.json
        template: .agents/skills/flutter-ui/templates/flutter-user-path-coverage.json
        internalModel: .psp/ui-spec/flutter-user-path-coverage.json
      preview-manifest:
        format: json
        contract: .agents/skills/flutter-ui/contracts/flutter-ui.md
        schema: .agents/skills/flutter-ui/schemas/preview-manifest.schema.json
        template: .agents/skills/flutter-ui/templates/preview-manifest.json
        internalModel: .psp/ui-spec/preview-manifest.json
      review-findings:
        format: json
        contract: .agents/skills/flutter-ui/contracts/flutter-ui.md
        schema: .agents/skills/flutter-ui/schemas/review-findings.schema.json
        template: .agents/skills/flutter-ui/templates/review-findings.json
        internalModel: .psp/ui-spec/review-findings.json
      ui-spec-manifest:
        format: json
        contract: .agents/skills/flutter-ui/contracts/flutter-ui.md
        schema: .agents/skills/flutter-ui/schemas/ui-spec-manifest.schema.json
        template: .agents/skills/flutter-ui/templates/ui-spec-manifest.json
        internalModel: .psp/ui-spec/manifest.json
  mockcase:
    status: uninitialized
    root: ""
    artifacts:
      mock-scenario-suite:
        format: json
        contract: .agents/skills/mockcase/contract.md
        schema: .agents/skills/mockcase/schemas/mock-scenario-suite.schema.json
        template: .agents/skills/mockcase/templates/suite.json
        internalModel: MockCase/suite.json
  architecture-design:
    status: uninitialized
    root: 02-architecture-design
    artifacts:
      architecture-package:
        format: yaml
        renderer: architecture-package-markdown
        contract: .agents/skills/architecture-design/architecture-package/contract.yaml
        schema: .agents/skills/architecture-design/architecture-package/schema.json
        template: .agents/skills/architecture-design/architecture-package/template.yaml
        inputRoot: inputs/architecture-package
        internalModel: .psp/models/architecture-package.yaml
        outputs:
          - path: README.md
            role: user-artifact
      system-boundary:
        format: yaml
        renderer: system-boundary-markdown
        contract: .agents/skills/architecture-design/system-boundary/contract.yaml
        schema: .agents/skills/architecture-design/system-boundary/schema.json
        template: .agents/skills/architecture-design/system-boundary/template.yaml
        inputRoot: inputs/system-boundary
        internalModel: .psp/models/system-boundary.yaml
        outputs:
          - path: 系统边界.md
            role: user-artifact
      conceptual-model:
        format: yaml
        renderer: conceptual-model-markdown
        contract: .agents/skills/architecture-design/conceptual-model/contract.yaml
        schema: .agents/skills/architecture-design/conceptual-model/schema.json
        template: .agents/skills/architecture-design/conceptual-model/template.yaml
        inputRoot: inputs/conceptual-model
        internalModel: .psp/models/conceptual-model.yaml
        outputs:
          - path: 概念建模.md
            role: user-artifact
      technical-validation:
        format: yaml
        renderer: technical-validation-markdown
        contract: .agents/skills/architecture-design/technical-validation/contract.yaml
        schema: .agents/skills/architecture-design/technical-validation/schema.json
        template: .agents/skills/architecture-design/technical-validation/template.yaml
        areaTemplate: .agents/skills/architecture-design/technical-validation/template-area
        inputRoot: inputs/technical-validation
        internalModel: .psp/models/technical-validation.yaml
        outputs:
          - path: 技术验证/README.md
            role: user-artifact
    areas:
      technical-validation:
        root: 技术验证

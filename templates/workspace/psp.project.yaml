apiVersion: psp.dev/v1
kind: PSPProject
harness:
  manifest: .psp/harness/harness.manifest.json
stages:
  product-design:
    status: uninitialized
    root: 01-product-design
    artifacts:
      product-package:
        internalModel: .psp/models/product-package.yaml
        outputs:
          - path: PSP.md
            role: user-artifact
      capabilities:
        internalModel: .psp/models/use-cases.yaml
        outputs:
          - path: UC.md
            role: user-artifact
      interactions:
        internalModel: .psp/models/wireflow-mid.yaml
        outputs:
          - path: wireflow-mid.md
            role: user-artifact
      canonical-ui-prototype:
        authority:
          kind: area
          area: canonical-ui-prototype
          semanticEntry: src/spec/canonical-ui.ts
        projections:
          - path: .psp/models/canonical-ui-prototype.json
            role: generated-support
          - path: Canonical-UI-Prototype/README.md
            role: user-artifact
    areas:
      canonical-ui-prototype:
        root: Canonical-UI-Prototype
  architecture-design:
    status: uninitialized
    root: 02-architecture-design
    artifacts:
      architecture-package:
        inputRoot: inputs/architecture-package
        internalModel: .psp/models/architecture-package.yaml
        outputs:
          - path: README.md
            role: user-artifact
      system-boundary:
        inputRoot: inputs/system-boundary
        internalModel: .psp/models/system-boundary.yaml
        outputs:
          - path: 系统边界.md
            role: user-artifact
      conceptual-model:
        inputRoot: inputs/conceptual-model
        internalModel: .psp/models/conceptual-model.yaml
        outputs:
          - path: 概念建模.md
            role: user-artifact
      technical-validation:
        inputRoot: inputs/technical-validation
        internalModel: .psp/models/technical-validation.yaml
        outputs:
          - path: 技术验证/README.md
            role: user-artifact
    areas:
      technical-validation:
        root: 技术验证

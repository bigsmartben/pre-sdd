apiVersion: psp.dev/v1
kind: PSPProject
harness:
  manifest: .psp/harness/harness.manifest.json
stages:
  product-design:
    status: uninitialized
    root: 01-product-design
    artifacts:
      capabilities:
        internalModel: .psp/models/use-cases.yaml
        outputs:
          - path: UC.md
            role: user-artifact
            projection: use-cases-document
      canonical-ui-prototype:
        authority:
          kind: area-set
          area: canonical-ui-prototypes
          semanticEntry: src/spec/canonical-ui.ts
          partitionKey: actor
        memberProjections:
          - root: .psp/models/canonical-ui-prototypes
            member: canonical-ui-prototype.json
            role: generated-support
          - root: Canonical-UI-Prototypes
            member: README.md
            role: user-artifact
    areas:
      canonical-ui-prototypes:
        root: Canonical-UI-Prototypes
  architecture-design:
    status: uninitialized
    root: 02-architecture-design
    artifacts:
      architecture-package:
        inputRoot: inputs/architecture-package
        internalModel: .psp/models/architecture-package.yaml
        outputs:
          - path: README.md
            role: user-artifact
      system-boundary:
        inputRoot: inputs/system-boundary
        internalModel: .psp/models/system-boundary.yaml
        outputs:
          - path: 系统边界.md
            role: user-artifact
      conceptual-model:
        inputRoot: inputs/conceptual-model
        internalModel: .psp/models/conceptual-model.yaml
        outputs:
          - path: 概念建模.md
            role: user-artifact
      technical-validation:
        inputRoot: inputs/technical-validation
        internalModel: .psp/models/technical-validation.yaml
        outputs:
          - path: 技术验证/README.md
            role: user-artifact
    areas:
      technical-validation:
        root: 技术验证

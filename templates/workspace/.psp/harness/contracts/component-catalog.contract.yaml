apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: component-catalog
  version: 3.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 作为 HTML Mock 的支撑契约，定义可复用视图组件的职责、I/O、状态、变体与代码入口。
  owns:
    - HTML Mock 到 Component 的映射
    - Component ID
    - 组件职责与 I/O
    - 组件状态与变体
    - 组件无障碍契约
  excludes:
    - 新产品能力
    - 新用户流程
    - Screen 信息层级
    - 生产业务实现
  domainRules:
    - unique-identifiers
    - component-html-mock-references
    - component-prototype-entry
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

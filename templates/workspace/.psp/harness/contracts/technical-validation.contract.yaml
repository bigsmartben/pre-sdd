apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: technical-validation
  version: 2.0.0
spec:
  stage: architecture-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 根据子系统能力及其输入输出对象完成可复用技术选型，以可执行代码和脱敏证据证明候选方案可行并固化决策。
  owns:
    - 子系统能力到技术决策的追溯
    - 输入输出对象模型与候选方案
    - 技术选型标准、候选项和最终选择
    - 可执行可行性实验与代码入口
    - 脱敏执行证据
    - 可供后续迭代复用的选型结论与适用限制
  excludes:
    - 真实密钥或 Token
    - 用 Mock 结果冒充三方 API 实测
    - 生产集成实现
  domainRules:
    - technical-validation-reference-integrity
    - technical-selection-capability-coverage
    - technical-selection-model-integrity
    - technical-selection-decision-complete
    - technical-validation-code-exists
    - technical-validation-runner-contract
    - technical-validation-evidence-complete
    - technical-validation-secret-free
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

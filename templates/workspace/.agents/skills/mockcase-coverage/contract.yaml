apiVersion: psp.dev/v1
kind: WorkflowContract
metadata:
  id: mockcase-coverage
  version: 1.0.0
spec:
  stage: product-design
  mode: read-only-candidate
  targetArtifact: canonical-ui-prototype
  inputs:
    - capabilities
    - canonical-ui-prototype
    - user-harness-manifest
  scopes:
    - actor
    - route
    - use-case
    - scenario
    - all-missing
  outputs:
    candidateSchema: .agents/skills/mockcase-coverage/candidate.schema.json
    coverageReportSchema: .agents/skills/mockcase-coverage/coverage-report.schema.json
  apply:
    owner: product-design
    operation: apply-mockcase-candidate
    executor: .agents/skills/product-design/canonical-ui-prototype/scripts/apply-mockcase-candidate.mjs
  guarantees:
    - generated-workspace-local-authority
    - deterministic-output
    - no-formal-write-during-analysis
    - upstream-gap-blocks-apply
    - input-lock-rejects-stale-candidate
    - scope-outside-content-preserved
    - mapped-does-not-imply-ready-or-verified

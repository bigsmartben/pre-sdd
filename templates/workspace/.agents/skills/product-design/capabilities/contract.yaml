apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: capabilities
  version: 5.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 维护稳定的产品行为目录，定义 Actor、产品范围、业务规则及可被 Wireflow 消费的 Use Case 场景；详细功能验收不由本产物拥有。
  owns:
    - 产品名称与产品意图
    - Actor 及其目标
    - 产品范围内外
    - 稳定的 Use Case 目标、价值、触发、前置条件与结果保证
    - 主场景及备选或异常场景的稳定步骤标识
    - 业务规则与 Use Case 关系
  excludes:
    - 详细 Given、When、Then 功能验收规格（由后续 spec.md 拥有）
    - 页面与导航
    - Screen、Control 与交互状态
    - 组件与视觉规则
    - 系统或子系统架构边界
    - 软件架构
  domainRules:
    - unique-identifiers
    - capability-actor-references
    - use-case-scenario-integrity
    - use-case-business-rule-integrity
    - use-case-relationship-integrity
    - product-scope-complete
    - use-cases-projection-deterministic
  projections:
    - id: use-cases-document
      outputRole: user-artifact
      readOnly: true
      sources:
        - intent
        - actors
        - productScope
        - businessRules
        - useCases
        - gaps
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: false

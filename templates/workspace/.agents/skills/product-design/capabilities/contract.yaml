apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: capabilities
  version: 7.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 以单一 Use Case 规格原子维护产品行为、正式交互流程与内部 Low-Fi UI Blueprint，并确定性生成 UC.md。
  owns:
    - 产品名称、产品意图、Actor 与产品范围
    - 稳定 Use Case 的目标、触发、前置条件、结果保证、主场景及备选或异常场景
    - Use Case 步骤到 Interaction State 与 Transition 的正式追溯
    - 从 Use Case 步骤派生的用户动作、系统响应与失败语义，以及 Transition 自有的重试、恢复与返回路径
    - UI 用例的内部信息架构、Screen、Region、Layout、Control 建议与 Control 到 Transition 的可达性追溯
    - 非 UI 用例的显式 not-applicable 决定
  excludes:
    - 详细 Given、When、Then 功能验收规格（由后续 spec.md 拥有）
    - Visual Spec、视觉 Token 与最终组件规则
    - 对 UI HTML 页面结构或像素布局的约束
    - HTML、CSS、JavaScript 与生产实现细节
    - 系统、子系统或软件架构边界
    - 独立 Wireflow 权威模型、投影、readiness 与 handoff
  domainRules:
    - unique-identifiers
    - capability-actor-references
    - use-case-scenario-integrity
    - use-case-business-rule-integrity
    - business-rule-referenced-by-use-case
    - use-case-relationship-integrity
    - interaction-flow-scenario-coverage
    - interaction-flow-step-traceability
    - interaction-state-transition-integrity
    - interaction-state-used-by-flow
    - shared-interaction-state-same-actor
    - interaction-failure-retry-recovery-return-explicit
    - ui-applicability-explicit
    - low-fi-blueprint-complete-for-ui-use-cases
    - low-fi-control-transition-traceability
    - low-fi-blueprint-advisory-only
    - product-scope-complete
    - use-cases-projection-deterministic
  projections:
    - id: use-cases-document
      outputRole: user-artifact
      readOnly: true
      sources:
        - intent
        - actors
        - productScope
        - businessRules
        - useCases
        - interactionStates
        - interactionFlows
        - lowFiUiBlueprints
        - gaps
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: false

apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: capabilities
  version: 4.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 以产品事实定义 Actor、产品范围和可被 Wireflow 消费的完整 Use Case 场景。
  owns:
    - 产品名称
    - 产品意图
    - Actor
    - 产品范围内外
    - Use Case 触发、前后置条件、主成功场景和备选/异常场景
    - 业务规则与可验收结果
  excludes:
    - 页面与导航
    - Screen、Control 与交互状态
    - 组件与视觉规则
    - 系统或子系统架构边界
    - 软件架构
  domainRules:
    - unique-identifiers
    - capability-actor-references
    - use-case-scenario-integrity
    - use-case-business-rule-integrity
    - use-case-acceptance-coverage
    - product-scope-complete
    - product-summary-projection-deterministic
  projections:
    - id: use-cases-document
      outputRole: user-artifact
      readOnly: true
      sources:
        - intent
        - actors
        - productScope
        - businessRules
        - useCases
        - gates
        - gaps
    - id: product-package-summary
      outputRole: user-artifact
      readOnly: true
      sources:
        - intent.productName
        - intent.productConcept
        - intent.problem
        - intent.businessGoal
        - intent.successSignal
        - actors
        - productScope
        - useCases
        - gates
        - gaps
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

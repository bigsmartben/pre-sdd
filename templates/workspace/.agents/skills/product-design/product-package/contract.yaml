apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: product-package
  version: 4.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 固化已澄清的 Product Idea 产品概览，并声明后续 Use Cases → Wireflow → Canonical UI Prototype 的读取顺序。
  owns:
    - 产品概览
    - 三段主链与支撑产物读取顺序
    - Product Idea 内容完整性门禁
  excludes:
    - 能力正文
    - 交互正文
    - Canonical UI Prototype 代码正文与软件架构实现细节
  domainRules:
    - package-primary-chain-order
    - package-supporting-artifacts-explicit
    - package-overview-complete
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

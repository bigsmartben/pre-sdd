apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: canonical-ui-prototype
  version: 12.0.0
spec:
  stage: product-design
  internalModelFormat: typescript
  outputRole: user-artifact
  purpose: 按关键参与者交付彼此独立且可执行的 UI HTML；每个 ACTOR-ID 应用固定 ready UC 与 Visual Spec 的版本和内容哈希，分别以 UI Interaction Scenario 验证行为路径、以 UI ViewModel 与 UI Case 验证页面组件视觉组合态。可执行 HTML/CSS/组件/资源是用户 Artifact，canonical-ui.ts 只是应用内部的机器索引与实现映射，不是独立用户 Artifact。
  owns:
    - 可执行界面、路由、交互与状态
    - UI HTML Draft 版本以及 ready UC、ready Visual Spec 的版本与内容哈希绑定
    - Screen、Component、Control、Event、Action 语义
    - Use Case 与正式 Interaction Flow 到可执行界面的追溯
    - Component Inventory（组件清单）、Figma ↔ Lit Component Mapping（组件映射）、Variant Definition（变体定义）、Usage（使用实例）、Component Contract（组件契约）、State Matrix（状态矩阵）与 `/__review/components` State Gallery（状态画廊）
    - Component Contract 到 Visual Spec Component 的显式引用，以及 Component Visual Case 到合法 State Matrix Entry 的可解析关系
    - UI ViewModel（界面视图模型）、UI Case（界面视觉用例）、Route 与 Viewport 的组合关系及轴值覆盖策略
    - Component Contract 驱动的组件、App/Feature Shell、页面实例、实现路径与 Token 复用边界
    - 设计来源采集、本地证据、Registration Packet（登记包）、内容哈希与覆盖关系
    - Capture Plan、Acquisition Packet、受控 Asset Ingest、来源版本、导出参数与消费目标双向闭包
    - 用户确认的运行环境、三模式视觉策略、设计令牌、动画、可选无障碍检查、渲染断言、来源一致性断言与追溯事实
    - 完全实现模式的设计截图基线、机器像素比较与固定容差
    - 完全实现模式下每个 Figma Page Instance、来源声明 Viewport 与合法 State Matrix Entry 的唯一 Component Source Parity 断言闭包
    - 三种已解析视觉模式共享的一次授权、一次修改、一次复验 Agent 修复契约，以及可修复阻断码、允许修改路径、Repair Packet 与 Repair Action Report
    - 每个参与者应用自己的 HTML、CSS、组件、资源、package.json、构建配置，以及内部 canonical-ui.ts 索引与隐藏 JSON 机器投影
    - Product Design 编排的 Review、Repair、Publish 与 Reopen 生命周期契约；Review Feedback Packet、Marker、截图、Repair Packet 和 Repair Action Report 仅为过程证据
    - Publish 对 UC、Visual Spec、Asset、UI HTML 源码、构建输入、Review 版本与 01 阶段身份的原子锁定
  excludes:
    - SwiftUI、Android 或 Web 生产实现映射
    - Figma 回写与 Code Connect 模板创建
    - 下游代码生成规则
    - Agent 代替用户作出 Repair、Human Visual Acceptance、Publish 或 Reopen 授权，以及 02 阶段初始化、外部平台移交或下游代码生成
    - 对 Low-Fi UI Blueprint 的结构或像素复刻
    - 用户未确认的多设备、响应式、横竖屏或无障碍范围
    - Validator 直接修改实现代码、自动放宽视觉容差或修改设计来源与业务语义
    - UI Case Mock 的 Review Tool 呈现、临时运行事务与临时截图证据；这些由 `$ui-case-mock` 子能力管理且不形成独立生命周期
    - 可重新生成的 dist 构建输出、会话级 HTTP 评审地址与临时运行证据；这些由运行器和 Validator 管理
  domainRules:
    - canonical-semantic-entry
    - canonical-actor-partition-parity
    - executable-browser-prototype
    - design-source-evidence-integrity
    - design-source-registration-integrity
    - design-source-ingestion
    - deterministic-asset-capture-plan
    - asset-consumption-bidirectional-closure
    - typed-browser-acceptance
    - user-confirmed-runtime-scope
    - workflow-and-component-state-separated
    - component-abstraction-source-backed
    - component-registration-handshake-closure
    - component-mapping-bidirectional
    - component-variant-definition-source-complete
    - component-variant-coverage-complete
    - component-usage-screen-paired
    - mapped-component-single-implementation-owner
    - component-contract-interface-complete
    - component-contract-screen-closure
    - component-contract-visual-spec-reference-complete
    - component-reuse-decision-explicit
    - application-shell-single-root
    - existing-lit-component-priority
    - layout-style-system-reused
    - token-target-css-binding-complete
    - token-runtime-consumption-complete
    - parallel-implementation-forbidden
    - finite-state-axis-kinds-distinct
    - finite-state-axis-coverage-disposition-complete
    - finite-state-axis-render-binding-complete
    - state-matrix-combination-classification-complete
    - ui-view-model-state-matrix-only
    - ui-case-route-viewport-closure
    - ui-case-axis-value-coverage-complete
    - component-source-parity-registered
    - exact-component-source-parity-matrix-complete
    - component-state-gallery-generated
    - component-contract-playwright-matrix-generated
    - exact-human-visual-acceptance-current
    - pixel-comparison-diagnostic-only
    - incremental-impact-analysis-grounded
    - formal-readiness-always-full
    - domain-traceability-complete
    - explicit-visual-policy
    - source-to-render-parity
    - agent-orchestrated-visual-repair
  implementationReuse:
    authority:
      componentIdentity:
        - componentContracts.implementationRole
        - componentContracts.litTagName
        - componentContracts.pageInstances
        - componentContracts.implementationPaths
      shellAndLayout:
        - routes
        - screens
        - componentContracts
        - visual-spec
      style:
        - tokens.targetIds
        - tokens.cssProperty
    requiredPreflight:
      - current-entry-and-router
      - registered-lit-elements
      - app-and-feature-shells
      - layout-and-style-primitives
      - shared-state-and-mock-layers
      - dependency-and-test-surface
    priority:
      - existing-contract-component
      - existing-app-or-feature-shell
      - existing-layout-or-style-primitive
      - property-attribute-slot-composition
      - page-local-structure
      - upstream-registered-new-component
    stopWhen:
      - contract-or-code-ownership-conflict
      - ambiguous-screen-root
      - parallel-router-state-api-mock-or-style-root-required
      - registered-token-would-be-bypassed
      - product-semantics-or-public-interface-would-change
  visualParity:
    channelTolerance: 8
    maxDifferentPixelRatio: 0.001
    screenshotMatchRole: non-blocking-diagnostic
  validationLayers:
    incrementalOperation: canonical-ui-incremental
    cacheLocation: os-temporary-directory
    layers:
      - static-input
      - assets
      - components
      - routes
      - visual-diagnostics
    fullReadinessProfiles:
      - product-delivery
      - canonical-ui-prototype
      - canonical-ui-review-readiness
    performanceBaseline: .agents/skills/product-design/canonical-ui-prototype/performance-baseline.json
  repair:
    orchestrator: agent
    validatorRole: decision-and-evidence-only
    maxAttempts: 1
    mode: agent-single-attempt
    allowedVisualModes:
      - autonomous
      - guided
      - exact
    defectClasses:
      - source-parity
      - html-structure
      - css-rendering
      - html-accessibility
      - asset-binding
      - component-contract
    packetSchema: .agents/skills/product-design/canonical-ui-prototype/repair-packet.schema.json
    actionReportSchema: .agents/skills/product-design/canonical-ui-prototype/repair-action-report.schema.json
    implementationPolicy:
      evidenceBeforeEdit: true
      sourceResolution: when-source-backed
      preserveInteractiveDom: true
      preferSourceAssets: true
      allowSubjectiveApproximation: false
      minimalImplementationScope: true
      stableComparisonEnvironment: true
      fixOrder:
        - structure
        - geometry
        - typography
        - paint
        - effects
        - assets
  review:
    feedbackPacketSchema: .agents/skills/product-design/canonical-ui-prototype/review-feedback-packet.schema.json
    evidenceSchema: .agents/skills/product-design/canonical-ui-prototype/review-evidence.schema.json
    visualAcceptanceSchema: .agents/skills/product-design/canonical-ui-prototype/visual-acceptance.schema.json
    visualAcceptanceRecord: .psp/reviews/product-design-visual-acceptance.json
    visualAcceptanceOperation: accept-canonical-ui-visual
    exactRequiresHumanAcceptance: true
    pixelComparisonRole: non-blocking-diagnostic
    feedbackRoutes:
      behavior: use-cases
      visual-input: visual-spec
      implementation: canonical-ui-prototype
  publication:
    receiptSchema: .agents/skills/product-design/canonical-ui-prototype/publication-receipt.schema.json
    completionEvent: publish-ui-html
    locks:
      - use-cases
      - visual-spec
      - visual-assets
      - ui-html-source
      - build-inputs
      - review-version
      - product-design-stage-identity
    downstreamAction: NOT_RUN
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: canonical-ui-prototype
  version: 2.0.0
spec:
  stage: product-design
  internalModelFormat: typescript
  outputRole: user-artifact
  purpose: 定义可在浏览器运行、具备完整界面语义的 Canonical UI Prototype，并以其静态语义入口作为界面规格唯一事实来源。
  owns:
    - 可执行界面、路由、交互与状态
    - Screen、Component、Control、Event、Action 语义
    - 设计来源采集、本地证据、内容哈希与覆盖关系
    - 设计令牌、响应式、动画、无障碍、视觉断言与追溯事实
    - README 评审投影与隐藏 JSON 机器投影
  excludes:
    - SwiftUI、Android 或 Web 生产实现映射
    - Figma 回写与 Code Connect 模板创建
    - 像素差异基线和容差管理
    - 下游代码生成规则
    - 用户审批、阶段推进或移交决策
  domainRules:
    - canonical-semantic-entry
    - executable-browser-prototype
    - design-source-evidence-integrity
    - figma-node-ingestion
    - typed-browser-acceptance
    - workflow-and-component-state-separated
    - domain-traceability-complete
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: false

apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: canonical-ui-prototype
  version: 4.0.0
spec:
  stage: product-design
  internalModelFormat: typescript
  outputRole: user-artifact
  purpose: 定义在用户已确认运行环境中执行、具备完整界面语义的 Canonical UI Prototype，并以其静态语义入口作为界面规格唯一事实来源。
  owns:
    - 可执行界面、路由、交互与状态
    - Screen、Component、Control、Event、Action 语义
    - Component Inventory（组件清单）、Figma ↔ Lit Component Mapping（组件映射）与 Variant Coverage Matrix（变体覆盖矩阵）
    - 设计来源采集、本地证据、内容哈希与覆盖关系
    - 用户确认的运行环境、三模式视觉策略、设计令牌、动画、可选无障碍检查、渲染断言、来源一致性断言与追溯事实
    - 完全实现模式的设计截图基线、机器像素比较与固定容差
    - 完全实现模式的 Agent 修复策略、三次尝试上限、可修复阻断码、允许修改路径、Repair Packet 与 Repair Action Report
    - README 评审投影与隐藏 JSON 机器投影
  excludes:
    - SwiftUI、Android 或 Web 生产实现映射
    - Figma 回写与 Code Connect 模板创建
    - 下游代码生成规则
    - 用户审批、阶段推进或移交决策
    - 用户未确认的多设备、响应式、横竖屏或无障碍范围
    - Validator 直接修改实现代码、自动放宽视觉容差或修改设计来源与业务语义
  domainRules:
    - canonical-semantic-entry
    - executable-browser-prototype
    - design-source-evidence-integrity
    - design-source-ingestion
    - typed-browser-acceptance
    - user-confirmed-runtime-scope
    - workflow-and-component-state-separated
    - component-abstraction-source-backed
    - component-mapping-bidirectional
    - component-variant-coverage-complete
    - mapped-component-single-implementation-owner
    - domain-traceability-complete
    - explicit-visual-policy
    - source-to-render-parity
    - agent-orchestrated-visual-repair
  visualParity:
    channelTolerance: 8
    maxDifferentPixelRatio: 0.001
  repair:
    orchestrator: agent
    validatorRole: decision-and-evidence-only
    maxAttempts: 3
    packetSchema: .agents/skills/product-design/canonical-ui-prototype/repair-packet.schema.json
    implementationPolicy:
      evidenceBeforeEdit: true
      requireSourceResolution: true
      preserveInteractiveDom: true
      preferSourceAssets: true
      allowSubjectiveApproximation: false
      minimalImplementationScope: true
      stableComparisonEnvironment: true
      fixOrder:
        - source-resolution
        - structure
        - geometry
        - typography
        - paint
        - effects
        - assets
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

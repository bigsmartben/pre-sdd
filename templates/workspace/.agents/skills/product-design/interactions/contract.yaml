apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: interactions
  version: 7.0.0
spec:
  stage: product-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 将单个关键参与者的已批准 Use Case 场景转换为独立交互蓝图；关键参与者集合严格等于 capabilities.useCases[].actor 的去重集合。每个 ACTOR-ID 目录拥有一份 YAML 机器权威模型，并确定性生成同目录对应的 Sitemap、User Flow 与 Wireframe 人类评审文档。
  owns:
    - Use Case 场景及步骤到 Wireflow 的引用式追溯
    - 当前关键参与者的独立 Sitemap 入口、页面层级与完整 Screen 覆盖
    - User Flow 的入口、状态迁移、完整 Guard、简短且同判断内唯一的分支标签与完成状态
    - Screen Registry、页面区域与 vertical/horizontal/region 布局树
    - 从参与者模型集合确定性生成的导航索引，以及每参与者独立 Sitemap、User Flow 与 Wireframe Markdown
    - 语义 Control 的页面归属及动作意图
    - 交互状态差量、Control 可用性与可达分支迁移
  excludes:
    - 新产品能力
    - 重述 Use Case 的用户目标、Actor 动作、系统责任或可观察结果
    - 独立手写且可能与 YAML 机器权威视图漂移的 Sitemap、User Flow 或 Wireframe
    - 可复用代码组件划分
    - 视觉 Token
    - HTML/CSS/JavaScript 实现
    - 生产实现细节
  domainRules:
    - unique-identifiers
    - interaction-upstream-references
    - interaction-local-references
    - interaction-use-case-scenario-coverage
    - interaction-upstream-step-traceable
    - interaction-sitemap-complete
    - interaction-user-flow-deterministic
    - interaction-layout-tree-complete
    - interaction-wireframe-deterministic
    - interaction-control-placement-complete
    - interaction-state-delta-complete
    - interaction-control-availability-valid
    - interaction-state-transition-integrity
    - interaction-actor-ownership
    - interaction-global-identifier-uniqueness
    - interaction-partition-parity
    - interaction-branch-label-deterministic
    - interaction-gate-set-exact
  projections:
    - id: wireflow-index
      outputRole: user-artifact
      readOnly: true
      sources:
        - metadata.actor
    - id: interactions-markdown
      outputRole: user-artifact
      readOnly: true
      sources:
        - metadata
        - siteMap
        - wireflows
        - screens
        - interactionStates
        - gaps
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

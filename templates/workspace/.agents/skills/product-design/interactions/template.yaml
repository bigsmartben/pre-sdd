apiVersion: psp.dev/v1
kind: WireflowMidSpecification
metadata:
  status: draft
  version: 0.1.0
  upstreamArtifact: capabilities
  actor: ACTOR-001
siteMap:
  entryScreen: null
  nodes: []
wireflows: []
screens: []
interactionStates: []
gates:
  - id: sitemap-complete
    label: 当前参与者的 Sitemap 覆盖其全部 Screen 并可从唯一入口到达
    checked: false
  - id: upstream-valid
    label: 每个 Wireflow 引用有效 Use Case
    checked: false
  - id: scenarios-covered
    label: 每个上游 Use Case 主场景及显式分支都被 Wireflow 覆盖
    checked: false
  - id: upstream-step-traceable
    label: 每个 Wireflow 步骤都引用所属场景中的有效 Use Case 步骤
    checked: false
  - id: user-flow-generated
    label: User Flow 可由 Wireflow 状态迁移确定性生成
    checked: false
  - id: layout-tree-complete
    label: 每个 Screen 的布局树恰好放置全部 Region
    checked: false
  - id: wireframe-generated
    label: Wireframe 可由 Screen 布局树确定性生成
    checked: false
  - id: control-placement-complete
    label: 每个语义 Control 都归属于明确 Region 和 Screen
    checked: false
  - id: state-delta-complete
    label: 每个交互状态都明确 show/hide、enable/disable 或 content 差量
    checked: false
  - id: transition-integrity
    label: 每个迁移都可从入口状态到达，并能到达声明的完成状态
    checked: false
  - id: control-availability-valid
    label: 触发迁移的 Control 在起始状态中可用
    checked: false
gaps:
  - id: GAP-001
    field: wireflows
    reason: 上游 Use Case 场景尚未形成完整的 Sitemap、User Flow 与 Wireframe

apiVersion: psp.dev/litspec-framework/v1
kind: LitSpecFrameworkContract
authority:
  framework: reusable-concepts-and-conformance
  mapping: project-perceptual-decisions
  implementation: lit-typescript-modules
  delivery: uihtml-product-bundle
concepts:
  Page:
    owns: [region-composition, component-instances, page-state-coordination]
    mustNotOwn: [url-mapping, reusable-component-internals]
  Region:
    owns: [perceptual-layout-responsibility]
    mustNotOwn: [routing, business-result]
  Component:
    owns: [properties, attributes, slots, typed-events, component-state, styles]
    mustNotOwn: [product-routing, environment-selection]
  State:
    layers: [business, interaction, page, component]
    rule: Equal names never imply equal identity across layers.
  Event:
    owns: [typed-semantic-communication]
    mustNotOwn: [business-result]
  Transition:
    owns: [legal-state-change]
  Route:
    owns: [url, parameters, guards, page-selection]
    mustNotOwn: [page-rendering]
  Motion:
    owns: [trigger, target, timing, interruption, reduced-motion]
    mustNotOwn: [business-result]
  DataModel:
    owns: [typed-data-shape]
  NorthboundPort:
    owns: [host-ui-service-boundary, errors, cancellation, async-result]
  Asset:
    owns: [product-asset-identity-and-usage]
  Token:
    owns: [reusable-visual-value]
moduleLayout:
  root: src/ui
  directories: [models, components, pages, routes, events, motions, ports]
dependencyRules:
  routes: [pages, models]
  pages: [components, events, motions, ports, models]
  components: [events, motions, models]
  events: [models]
  motions: [models]
  ports: [models, events]
  models: []
forbidden:
  - centralized-ui-table
  - generic-runtime-ui-ir
  - project-page-in-framework
  - project-route-in-framework
blockerCodes:
  conceptOwnership: LITSPEC_RESPONSIBILITY_COLLISION
  dependencyDirection: LITSPEC_DEPENDENCY_INVALID
  genericUiIr: GENERIC_UI_IR_REQUIRED
  projectInstance: PROJECT_DATA_IN_FRAMEWORK_CONTRACT

apiVersion: psp.dev/lit-ui-blockers/v1
kind: LitUiBlockerCatalog
codes:
  LITSPEC_RESPONSIBILITY_COLLISION: framework concept ownership overlaps
  LITSPEC_DEPENDENCY_INVALID: module dependency direction is invalid
  GENERIC_UI_IR_REQUIRED: framework requires a centralized UI table
  PROJECT_DATA_IN_FRAMEWORK_CONTRACT: reusable framework contains project facts
  MAPPING_AUTHORITY_DUPLICATED: parallel mapping authority exists
  MAPPING_GAPS_OPEN: mapping has an unresolved gap or question
  MAPPING_CONFIRMATION_STALE: confirmation does not bind current source and mapping hashes
  MAPPING_RECONFIRMATION_REQUIRED: changed source or Mapping requires a new confirmation
  MAPPING_USER_CONFIRMATION_REQUIRED: confirmation lacks a non-empty user identity or valid UTC timestamp
  MAPPING_LEAKS_IMPLEMENTATION_DETAIL: mapping contains code or DOM details
  MAPPING_STATE_LAYER_COLLISION: state layers were merged without user confirmation
  MAPPING_SOURCE_AUTHORITY_VIOLATION: visual and business sources exceeded their authority
  MAPPING_QUESTION_UNBOUND: clarification question lacks a stable conceptId
  MAPPING_ARTIFACT_MISSING: strict validation cannot find the project Mapping.html
  LIT_IMPLEMENTATION_NOT_AUTHORIZED: implementation was requested before confirmation
  LIT_MODULE_AUTHORITY_MISSING: native Lit module authority is incomplete
  LIT_DIRECT_BUILD_FAILED: src/ui/main.ts cannot build directly
  GENERIC_UI_IR_RUNTIME_DEP: product runtime requires a generic UI IR
  LIT_ROUTE_PAGE_COLLISION: Route owns Page rendering
  PORT_ADAPTER_CONTRACT_MISMATCH: real and Mock adapters do not share one Port contract
  LIT_COMPONENT_MOCK_COUPLED: Page or Component branches on environment
  HOST_EVENT_CONTRACT_MISSING: host events lack a typed boundary
  MOCK_ADAPTER_IN_UIHTML: production UIHTML includes a Mock adapter
  CANONICAL_UI_RUNTIME_DEP_REMAINS: migration-history centralized runtime dependency remains
  HIDDEN_UI_IR_REMAINS: hidden UI projection remains
  CANONICAL_PROJECTION_REFRESH_REQUIRED: a workflow still refreshes the migration-history projection
  GENERIC_UI_IR_REINTRODUCED: an isomorphic centralized table was reintroduced
  REVIEW_TOOL_PRODUCT_OWNERSHIP: Review owns a product Route, State, or Port
  REVIEW_TOOL_IN_UIHTML: Review code is in the product bundle
  REVIEW_TOOL_HASH_LEAK: Review changes affect the product hash
  REVIEW_TOOL_FAILURE_PROPAGATED: Review failure prevents product startup
  REVIEW_MARK_UNBOUND: Review mark lacks a stable conceptId
  UI_CASE_LAYER_COLLISION: Business and Component Case responsibilities overlap
  UI_CASE_TRACEABILITY_MISSING: a case lacks UC, Mapping, or Framework traceability
  UI_CASE_INVENTS_BUSINESS_FACT: a case fact has no declared source
  UI_CASE_RUNTIME_DEP: Cases became a product runtime model
  UIHTML_RUNTIME_DEP_MISSING: standalone product runtime or asset is missing
  NON_PRODUCT_DEPENDENCY_IN_UIHTML: product delivery contains a non-product dependency
  UIHTML_INTERACTION_PARITY_FAILED: confirmed interaction branch failed
  UIHTML_MOTION_PARITY_FAILED: motion timing, interruption, or reduced-motion failed
  UIHTML_VISUAL_PARITY_FAILED: Figma node and viewport comparison exceeded its threshold
  UIHTML_HASH_BOUNDARY_INVALID: non-product change affected product hash
  CENTRAL_UI_CONTROL_PLANE_REINTRODUCED: central lifecycle control plane was introduced
  LIT_UI_SCAFFOLD_INCOMPLETE: packaged capability snapshot is incomplete
  PRODUCT_INSTANCE_IN_SCAFFOLD: scaffold contains a real project Mapping, Lit implementation, or UIHTML
  SCAFFOLD_BUILD_OUTPUT_LEAK: scaffold contains dependencies, build output, or runtime evidence
  LIT_UI_INIT_SNAPSHOT_MISMATCH: initialized capability snapshot differs from the template
  WORKSPACE_UPGRADE_SURFACE_INTRODUCED: public CLI exposes update, upgrade, or sync

apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: architecture-package
  version: 3.0.0
spec:
  stage: architecture-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 声明架构设计 Package 的范围、可选只读产品输入、产物顺序与交付门禁。
  inputs:
    artifacts:
      - system-boundary
      - conceptual-model
      - technical-validation
    directoryRole: supporting-input
  references:
    - stage: product-design
      artifact: capabilities
      required: false
      access: read-only
      fixedVersionField: productDesignInput.reference.version
      lifecycleControl: none
  owns:
    - 架构目标与约束
    - 是否使用 Product Design 输入及其固定版本引用
    - Package 产物读取顺序
    - Package 级 readiness gate
  excludes:
    - 新增或改写产品事实
    - 控制 Product Design 生命周期、readiness 或发布状态
    - 详细实现计划
    - 生产代码
  domainRules:
    - architecture-optional-product-reference
    - architecture-artifact-order
    - architecture-overview-complete
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

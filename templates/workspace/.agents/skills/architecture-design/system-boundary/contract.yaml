apiVersion: psp.dev/v1
kind: ArtifactContract
metadata:
  id: system-boundary
  version: 3.0.0
spec:
  stage: architecture-design
  internalModelFormat: yaml
  outputRole: user-artifact
  purpose: 从已批准 Actor 与 Use Case 抽象长期稳定的系统/子系统边界、能力输入输出以及明确的不负责范围。
  inputs:
    artifacts:
      - capabilities
    directoryRole: supporting-input
  owns:
    - 系统与子系统的职责边界
    - 子系统能力及语义输入输出
    - 子系统做什么与不做什么
    - 外部系统与信任边界
    - Actor、Use Case 到子系统能力的追溯
  excludes:
    - 新产品能力
    - 对象字段与唯一键定义
    - 技术栈选择
  domainRules:
    - architecture-upstream-references
    - system-boundary-use-case-coverage
    - system-boundary-subsystem-coverage
    - system-boundary-capability-coverage
    - system-boundary-in-out-scope-explicit
    - system-boundary-technical-validation-routing
  readiness:
    requiredStatus: ready
    requireNoGaps: true
    requireAllGates: true

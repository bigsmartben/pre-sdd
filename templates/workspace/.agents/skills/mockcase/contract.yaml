apiVersion: psp.dev/mockcase/v2
kind: MockCaseContract
inputs:
  uiCases:
    contract: .agents/skills/use-case-generation/contract.yaml
    role: read-only-neutral-input
outputs:
  suite:
    owns: [fixtures, mock-scenarios, review-status]
  evidence:
    owns: [review-and-verification-results]
boundaries:
  - MockCase never edits UC, Mapping, Lit modules, or UIHTML.
  - MockCase never imports into the product entry.
  - Mock adapters implement the same Port contract as real adapters.
  - Applying a candidate requires explicit user authorization and an exact input digest.
